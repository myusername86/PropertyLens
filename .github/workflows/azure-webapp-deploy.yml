name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/azure-webapp-deploy.yml'

env:
  AZURE_WEBAPP_NAME: PropertyLens-API
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ArvSaas.sln

      - name: Build
        run: dotnet build ArvSaas.sln --no-restore -c Release

      - name: Publish
        run: dotnet publish src/ArvSaas.Api/ArvSaas.Api.csproj -c Release -o ${{ github.workspace }}/publish --no-build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish